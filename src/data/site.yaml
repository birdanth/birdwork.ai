# birdwork.ai — content + micro-layout manifest
# ---------------------------------------------------------------------------
# This file is the site. Edit values here, run `node scripts/build.mjs`,
# and index.html is regenerated. Nothing else needs touching for copy, list,
# label or spacing changes.
#
# Rules of the file:
#   * one level of nesting per concept; lists are `- ` blocks or [a, b]
#   * `·` separators live inside the value, not in the markup
#   * HTML entities are allowed where the markup needs them (&amp; &thinsp;)
#   * any value containing " #" must be quoted (comments start at " #")
#   * `label` drives the navbar link AND the section heading
#     `nav_label` (optional) overrides the navbar link only
#     `eyebrow` is the small uppercase line above the heading
#   * `layout.<path>.<prop>` maps to the CSS custom property `--<path>-<prop>`
#     (nest as needed: `layout.work.lead.mb` -> `--work-lead-mb`;
#      use _ in a name for a breakpoint variant, e.g. section_mobile)
#     props: m mt mb ml mr p pt pb pl pr py px gap
#     values: 0 xs sm md lg xl 2xl (0, .5rem, 1rem, 1.5rem, 2.25rem, 3.5rem, 5rem)
#     or a raw CSS length
# ---------------------------------------------------------------------------

