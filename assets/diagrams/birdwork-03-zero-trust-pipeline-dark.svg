<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="1040" height="320" role="img" aria-label="Six-Layer Zero-Trust Agentic Security Pipeline (Dark Theme)">

  <defs>
    <marker id="arr-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#F2EFE9"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#D4B48C"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#A4A4F0"/>
    </marker>
    <pattern id="hatch-bronze-dark" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#D4B48C" stroke-width="1.2" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="1040" height="320" fill="#121110" stroke="#35302B" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="34" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="10.5" letter-spacing="2.2">FIG 03 · ZERO-TRUST AGENTIC EXECUTION PIPELINE</text>
  <text x="1008" y="34" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#B5AEA5" font-size="10" text-anchor="end" letter-spacing="1.2">DEFENSE-IN-DEPTH FOR REGULATED WORKFLOWS</text>
  <line x1="32" y1="48" x2="1008" y2="48" stroke="#35302B" stroke-width="1"/>

  <!-- Dashed Client VPC Grouping around Gates 03-05 -->
  <rect x="352" y="64" width="484" height="190" fill="#1F1C19" stroke="#D4B48C" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="594" y="81" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="9.5" text-anchor="middle" letter-spacing="1.6">CLIENT-CONTROLLED VPC &amp; CONTAINER BOUNDARY</text>

  <!-- Gate 01 -->
  <rect x="32" y="96" width="144" height="144" fill="#191715" stroke="#35302B" stroke-width="1"/>
  <rect x="32" y="96" width="144" height="24" fill="#2A2622"/>
  <text x="44" y="112" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#FAF9F6" font-size="9.5" letter-spacing="1.2">01 · INGRESS</text>
  <text x="44" y="144" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="12.5" font-weight="600">PII Redaction</text>
  <text x="44" y="166" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Pre-inference</text>
  <text x="44" y="182" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">masking strips</text>
  <text x="44" y="198" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">regulated fields</text>
  <text x="44" y="226" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="9">BEFORE LLM CALL</text>

  <!-- Gate 02 -->
  <rect x="192" y="96" width="144" height="144" fill="#191715" stroke="#35302B" stroke-width="1"/>
  <rect x="192" y="96" width="144" height="24" fill="#2A2622"/>
  <text x="204" y="112" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#FAF9F6" font-size="9.5" letter-spacing="1.2">02 · SECRETS</text>
  <text x="204" y="144" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="12.5" font-weight="600">Credential Vault</text>
  <text x="204" y="166" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Scoped, short-lived</text>
  <text x="204" y="182" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">tokens; zero keys</text>
  <text x="204" y="198" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">in agent memory</text>
  <text x="204" y="226" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="9">ZERO HARDCODED</text>

  <!-- Gate 03 -->
  <rect x="364" y="96" width="144" height="144" fill="#191715" stroke="#A4A4F0" stroke-width="1.2"/>
  <rect x="364" y="96" width="144" height="24" fill="#3E3E78"/>
  <text x="376" y="112" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#FAF9F6" font-size="9.5" letter-spacing="1.2">03 · RUNTIME</text>
  <text x="376" y="144" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="12.5" font-weight="600">Env. Isolation</text>
  <text x="376" y="166" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Private container</text>
  <text x="376" y="182" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">&amp; network rules;</text>
  <text x="376" y="198" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">client-owned host</text>
  <text x="376" y="226" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#A4A4F0" font-size="9">DOCKER · VPC</text>

  <!-- Gate 04 -->
  <rect x="522" y="96" width="144" height="144" fill="#191715" stroke="#A4A4F0" stroke-width="1.2"/>
  <rect x="522" y="96" width="144" height="24" fill="#3E3E78"/>
  <text x="534" y="112" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#FAF9F6" font-size="9.5" letter-spacing="1.2">04 · EXECUTION</text>
  <text x="534" y="144" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="12.5" font-weight="600">Tool Allowlist</text>
  <text x="534" y="166" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Schema-validated</text>
  <text x="534" y="182" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">interfaces block</text>
  <text x="534" y="198" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">arbitrary calls</text>
  <text x="534" y="226" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#A4A4F0" font-size="9">PYDANTIC STRICT</text>

  <!-- Gate 05 -->
  <rect x="680" y="96" width="144" height="144" fill="#191715" stroke="#A4A4F0" stroke-width="1.2"/>
  <rect x="680" y="96" width="144" height="24" fill="#3E3E78"/>
  <text x="692" y="112" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#FAF9F6" font-size="9.5" letter-spacing="1.2">05 · CONTROL</text>
  <text x="692" y="144" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="12.5" font-weight="600">HITL Gate</text>
  <text x="692" y="166" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Explicit human</text>
  <text x="692" y="182" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">sign-off before</text>
  <text x="692" y="198" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">state mutations</text>
  <text x="692" y="226" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#A4A4F0" font-size="9">APPROVAL LOCK</text>

  <!-- Gate 06 -->
  <rect x="852" y="96" width="156" height="144" fill="#191715" stroke="#35302B" stroke-width="1"/>
  <rect x="852" y="96" width="156" height="24" fill="#2A2622"/>
  <text x="864" y="112" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#FAF9F6" font-size="9.5" letter-spacing="1.2">06 · GOVERNANCE</text>
  <text x="864" y="144" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="12.5" font-weight="600">Audit Logging</text>
  <text x="864" y="166" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Immutable trace</text>
  <text x="864" y="182" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">of prompts, tools,</text>
  <text x="864" y="198" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">&amp; sign-off events</text>
  <text x="864" y="226" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="9">LOGRHYTHM · SIEM</text>

  <!-- Directional connectors between gates -->
  <line x1="176" y1="168" x2="189" y2="168" stroke="#F2EFE9" stroke-width="1.25" marker-end="url(#arr-light)"/>
  <line x1="336" y1="168" x2="361" y2="168" stroke="#F2EFE9" stroke-width="1.25" marker-end="url(#arr-light)"/>
  <line x1="508" y1="168" x2="519" y2="168" stroke="#A4A4F0" stroke-width="1.4" marker-end="url(#arr-indigo)"/>
  <line x1="666" y1="168" x2="677" y2="168" stroke="#A4A4F0" stroke-width="1.4" marker-end="url(#arr-indigo)"/>
  <line x1="824" y1="168" x2="849" y2="168" stroke="#F2EFE9" stroke-width="1.25" marker-end="url(#arr-light)"/>

  <!-- Bottom Compliance Strip -->
  <line x1="32" y1="274" x2="1008" y2="274" stroke="#35302B" stroke-width="1"/>
  <text x="32" y="298" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#B5AEA5" font-size="10" letter-spacing="1.5">ENGINEERED FOR REGULATED ENTERPRISES:</text>
  <text x="348" y="298" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#F2EFE9" font-size="10.5" letter-spacing="1.2">HIPAA · SOC 2 · RBAC · HEALTHCARE · PAYMENTS · LEGAL</text>
</svg>
