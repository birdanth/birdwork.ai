  <text x="1008" y="34" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#B5AEA5" font-size="10" text-anchor="end" letter-spacing="1.2">BEFORE VS. AFTER PRODUCTION TUNING</text>
  <line x1="32" y1="48" x2="1008" y2="48" stroke="#35302B" stroke-width="1"/>

