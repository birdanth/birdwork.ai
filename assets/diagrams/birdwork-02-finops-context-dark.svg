  <rect x="32" y="68" width="308" height="270" fill="#191715" stroke="#35302B" stroke-width="1"/>
  <text x="52" y="96" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="10" letter-spacing="1.5">01 / TIERED MODEL ROUTING</text>
  <text x="52" y="118" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="13.5" font-weight="600">Routine Query Inference Cost</text>
  <line x1="52" y1="132" x2="320" y2="132" stroke="#35302B" stroke-width="1"/>

  <text x="52" y="158" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#B5AEA5" font-size="10">BASELINE · FRONTIER ONLY</text>
  <text x="320" y="158" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#F2EFE9" font-size="11" font-weight="600" text-anchor="end">$15 / MTok</text>
  <rect x="52" y="168" width="268" height="24" fill="#4A433B"/>
  <rect x="52" y="168" width="268" height="24" fill="url(#hatch-bronze-dark)"/>

  <text x="52" y="220" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#A4A4F0" font-size="10">TUNED · TIERED ROUTE</text>
  <text x="320" y="220" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#A4A4F0" font-size="11" font-weight="600" text-anchor="end">$0–$1 / MTok</text>
  <rect x="52" y="230" width="268" height="24" fill="#24211D" stroke="#35302B" stroke-width="1"/>
  <rect x="52" y="230" width="18" height="24" fill="#7C7CE0"/>

  <line x1="52" y1="280" x2="320" y2="280" stroke="#35302B" stroke-width="1"/>
  <text x="52" y="308" font-family="'Cormorant Garamond', 'Liberation Serif', Georgia, serif" fill="#F2EFE9" font-size="24" font-weight="600">Up to 93% Less</text>
  <text x="52" y="325" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Frontier models reserved for hard tasks</text>

