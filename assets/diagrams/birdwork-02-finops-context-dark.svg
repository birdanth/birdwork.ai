  <rect x="366" y="68" width="308" height="270" fill="#191715" stroke="#35302B" stroke-width="1"/>
  <text x="386" y="96" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="10" letter-spacing="1.5">02 / CONTEXT WINDOW DISCIPLINE</text>
  <text x="386" y="118" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="13.5" font-weight="600">Active Window Utilization</text>
  <line x1="386" y1="132" x2="654" y2="132" stroke="#35302B" stroke-width="1"/>

  <text x="386" y="158" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#B5AEA5" font-size="10">UNPRUNED · BLOATED &amp; DRIFTING</text>
  <text x="654" y="158" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#F2EFE9" font-size="11" font-weight="600" text-anchor="end">98%</text>
  <rect x="386" y="168" width="268" height="24" fill="#24211D" stroke="#35302B" stroke-width="1"/>
  <rect x="386" y="168" width="262" height="24" fill="#D4B48C" fill-opacity="0.30"/>
  <rect x="386" y="168" width="262" height="24" fill="url(#hatch-bronze-dark)"/>

  <text x="386" y="220" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#F2EFE9" font-size="10">PRUNED · HIGH-SIGNAL CONTEXT</text>
  <text x="654" y="220" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#F2EFE9" font-size="11" font-weight="600" text-anchor="end">70%</text>
  <rect x="386" y="230" width="268" height="24" fill="#24211D" stroke="#35302B" stroke-width="1"/>
  <rect x="386" y="230" width="188" height="24" fill="#F2EFE9"/>
  <line x1="574" y1="224" x2="574" y2="260" stroke="#D4B48C" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="614" y="246" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="9" text-anchor="middle">30% FREE</text>

  <line x1="386" y1="280" x2="654" y2="280" stroke="#35302B" stroke-width="1"/>
  <text x="386" y="308" font-family="'Cormorant Garamond', 'Liberation Serif', Georgia, serif" fill="#F2EFE9" font-size="24" font-weight="600">98% → 70%</text>
  <text x="386" y="325" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Stops silent accuracy decay in long runs</text>

  <!-- PANEL 3: PROMPT CACHING & NET SPEND -->
  <rect x="700" y="68" width="308" height="270" fill="#191715" stroke="#CFC8BC" stroke-width="1.25"/>
  <text x="720" y="96" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#D4B48C" font-size="10" letter-spacing="1.5">03 / CACHING &amp; NET SPEND</text>
  <text x="720" y="118" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#F2EFE9" font-size="13.5" font-weight="600">Measured Production Outcome</text>
  <line x1="720" y1="132" x2="988" y2="132" stroke="#35302B" stroke-width="1"/>

  <text x="720" y="160" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#A4A4F0" font-size="10">PREFIX-STABLE PROMPT CACHE</text>
  <text x="988" y="160" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#A4A4F0" font-size="11.5" font-weight="600" text-anchor="end">68% HIT</text>
  <g transform="translate(720, 170)">
    <rect x="0"   y="0" width="23" height="18" fill="#7C7CE0"/>
    <rect x="27"  y="0" width="23" height="18" fill="#7C7CE0"/>
    <rect x="54"  y="0" width="23" height="18" fill="#7C7CE0"/>
    <rect x="81"  y="0" width="23" height="18" fill="#7C7CE0"/>
    <rect x="108" y="0" width="23" height="18" fill="#7C7CE0"/>
    <rect x="135" y="0" width="23" height="18" fill="#7C7CE0"/>
    <rect x="162" y="0" width="18" height="18" fill="#7C7CE0"/>
    <rect x="180" y="0" width="5"  height="18" fill="#24211D" stroke="#35302B" stroke-width="0.8"/>
    <rect x="189" y="0" width="23" height="18" fill="#24211D" stroke="#35302B" stroke-width="0.8"/>
    <rect x="216" y="0" width="23" height="18" fill="#24211D" stroke="#35302B" stroke-width="0.8"/>
    <rect x="243" y="0" width="25" height="18" fill="#24211D" stroke="#35302B" stroke-width="0.8"/>
  </g>
  <text x="720" y="206" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="11">Deterministic prefix layout eliminates re-prefill</text>

  <rect x="720" y="226" width="268" height="94" fill="#1F1C19" stroke="#35302B" stroke-width="1"/>
  <text x="738" y="252" font-family="'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace" fill="#B5AEA5" font-size="9.5" letter-spacing="1.4">SUSTAINED NET LLM SPEND</text>
  <text x="738" y="294" font-family="'Cormorant Garamond', 'Liberation Serif', Georgia, serif" fill="#A4A4F0" font-size="40" font-weight="600">50%+ Lower</text>
  <text x="738" y="311" font-family="'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif" fill="#B5AEA5" font-size="10.5">Held across 3+ months live traffic</text>
