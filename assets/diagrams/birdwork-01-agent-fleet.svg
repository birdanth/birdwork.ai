<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" width="1040" height="410" role="img" aria-label="Production 5-Agent Fleet Architecture on Client Infrastructure">

  <style>
    .bw-serif { font-family: 'Cormorant Garamond', 'Liberation Serif', Georgia, serif; }
    .bw-sans  { font-family: 'Inter', 'Liberation Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    .bw-mono  { font-family: 'JetBrains Mono', 'Liberation Mono', ui-monospace, monospace; }
  </style>


  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2D2A26"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#8B7355"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3A3A6A"/>
    </marker>
    <pattern id="hatch-bronze" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8B7355" stroke-width="1.2" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <rect class="bw-canvas" x="0" y="0" width="1040" height="410" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>

  <!-- Top Header Strip -->
  <text class="bw-mono bw-bronze" x="32" y="34" fill="#8B7355" font-size="10.5" letter-spacing="2.2">FIG 01 · PRODUCTION MULTI-AGENT ARCHITECTURE</text>
  <text class="bw-mono bw-mid" x="1008" y="34" fill="#6B6560" font-size="10" text-anchor="end" letter-spacing="1.2">CLIENT-CONTROLLED INFRASTRUCTURE</text>
  <line class="bw-rule" x1="32" y1="48" x2="1008" y2="48" stroke="#DDD8CE" stroke-width="1"/>

  <!-- LEFT COLUMN: HUMAN INTERFACE -->
  <text class="bw-mono bw-mid" x="32" y="76" fill="#6B6560" font-size="10" letter-spacing="1.8">01 / INTERFACE</text>

  <!-- Slack Box -->
  <rect class="bw-card-strong" x="32" y="92" width="210" height="104" fill="#FAF9F6" stroke="#2D2A26" stroke-width="1.25"/>
  <text class="bw-mono bw-bronze" x="48" y="118" fill="#8B7355" font-size="9.5" letter-spacing="1.4">SLACK WORKSPACE</text>
  <text class="bw-sans bw-ink" x="48" y="142" fill="#2D2A26" font-size="13.5" font-weight="600">Plain-English Queries</text>
  <text class="bw-sans bw-mid" x="48" y="162" fill="#6B6560" font-size="11.5">Non-technical staff query</text>
  <text class="bw-sans bw-mid" x="48" y="178" fill="#6B6560" font-size="11.5">live CRM &amp; ops metrics</text>

  <!-- HITL Approval Box -->
  <rect class="bw-card" x="32" y="216" width="210" height="84" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>
  <text class="bw-mono bw-indigo" x="48" y="241" fill="#3A3A6A" font-size="9.5" letter-spacing="1.4">HUMAN-IN-THE-LOOP</text>
  <text class="bw-sans bw-ink" x="48" y="264" fill="#2D2A26" font-size="13" font-weight="600">Approval Gating</text>
  <text class="bw-sans bw-mid" x="48" y="283" fill="#6B6560" font-size="11.5">Explicit sign-off on state writes</text>

  <!-- Arrows Left <-> Center -->
  <line x1="242" y1="144" x2="292" y2="144" stroke="#2D2A26" stroke-width="1.25" marker-end="url(#arr-dark)"/>
  <line x1="296" y1="258" x2="246" y2="258" stroke="#3A3A6A" stroke-width="1.4" marker-end="url(#arr-indigo)"/>
  <text class="bw-mono bw-mid" x="268" y="135" fill="#6B6560" font-size="8.5" text-anchor="middle">QUERY</text>
  <text class="bw-mono bw-indigo" x="270" y="249" fill="#3A3A6A" font-size="8.5" text-anchor="middle">GATE</text>

  <!-- CENTER COLUMN: ZERO-TRUST VPC ZONE -->
  <rect class="bw-zone" x="296" y="64" width="446" height="252" fill="#F3F0E9" stroke="#8B7355" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="bw-mono bw-bronze" x="314" y="84" fill="#8B7355" font-size="9.8" letter-spacing="1.4">02 / ZERO-TRUST BOUNDARY · 5-AGENT FLEET (PYTHON)</text>

  <!-- Orchestration Bar -->
  <rect class="bw-dark-bar" x="314" y="98" width="410" height="36" fill="#2D2A26"/>
  <text class="bw-mono" x="519" y="120" fill="#FAF9F6" font-size="9.2" text-anchor="middle" letter-spacing="0.9">PERSISTENT MEMORY · 70% CONTEXT PRUNING · TIERED ROUTING</text>

  <!-- 5 Agent Cards -->
  <rect class="bw-card" x="314" y="150" width="128" height="68" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>
  <text class="bw-mono bw-bronze" x="326" y="170" fill="#8B7355" font-size="9">AGENT 01</text>
  <text class="bw-sans bw-ink" x="326" y="189" fill="#2D2A26" font-size="12" font-weight="600">Data Concierge</text>
  <text class="bw-sans bw-mid" x="326" y="206" fill="#6B6560" font-size="10.5">NL → SQL &amp; BI</text>

  <rect class="bw-card" x="455" y="150" width="128" height="68" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>
  <text class="bw-mono bw-bronze" x="467" y="170" fill="#8B7355" font-size="9">AGENT 02</text>
  <text class="bw-sans bw-ink" x="467" y="189" fill="#2D2A26" font-size="12" font-weight="600">Strategic Asst.</text>
  <text class="bw-sans bw-mid" x="467" y="206" fill="#6B6560" font-size="10.5">Executive briefs</text>

  <rect class="bw-card" x="596" y="150" width="128" height="68" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>
  <text class="bw-mono bw-bronze" x="608" y="170" fill="#8B7355" font-size="9">AGENT 03</text>
  <text class="bw-sans bw-ink" x="608" y="189" fill="#2D2A26" font-size="12" font-weight="600">Ops Monitor</text>
  <text class="bw-sans bw-mid" x="608" y="206" fill="#6B6560" font-size="10.5">24/7 exception watch</text>

  <rect class="bw-card" x="358" y="232" width="154" height="68" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>
  <text class="bw-mono bw-bronze" x="370" y="252" fill="#8B7355" font-size="9">AGENT 04</text>
  <text class="bw-sans bw-ink" x="370" y="271" fill="#2D2A26" font-size="12" font-weight="600">Project Coord.</text>
  <text class="bw-sans bw-mid" x="370" y="288" fill="#6B6560" font-size="10.5">Cross-team handoffs</text>

  <rect class="bw-card" x="526" y="232" width="154" height="68" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>
  <text class="bw-mono bw-bronze" x="538" y="252" fill="#8B7355" font-size="9">AGENT 05</text>
  <text class="bw-sans bw-ink" x="538" y="271" fill="#2D2A26" font-size="12" font-weight="600">Operations Clerk</text>
  <text class="bw-sans bw-mid" x="538" y="288" fill="#6B6560" font-size="10.5">Comms &amp; doc intake</text>

  <!-- Arrows Center -> Right -->
  <line x1="742" y1="144" x2="792" y2="144" stroke="#2D2A26" stroke-width="1.25" marker-end="url(#arr-dark)"/>
  <line x1="742" y1="258" x2="792" y2="258" stroke="#8B7355" stroke-width="1.25" marker-end="url(#arr-bronze)"/>
  <text class="bw-mono bw-mid" x="767" y="135" fill="#6B6560" font-size="8.5" text-anchor="middle">RAG</text>
  <text class="bw-mono bw-bronze" x="767" y="249" fill="#8B7355" font-size="8.5" text-anchor="middle">OUT</text>

  <!-- RIGHT COLUMN: DATA & DEPARTMENTS -->
  <text class="bw-mono bw-mid" x="796" y="76" fill="#6B6560" font-size="10" letter-spacing="1.8">03 / DATA &amp; OUTPUTS</text>

  <rect class="bw-card-indigo" x="796" y="92" width="212" height="104" fill="#FAF9F6" stroke="#3A3A6A" stroke-width="1.25"/>
  <text class="bw-mono bw-indigo" x="812" y="118" fill="#3A3A6A" font-size="9.5" letter-spacing="1.4">CRM &amp; DATA LAYER</text>
  <text class="bw-serif bw-ink" x="812" y="148" fill="#2D2A26" font-size="26" font-weight="600">5.7M Records</text>
  <text class="bw-sans bw-mid" x="812" y="170" fill="#6B6560" font-size="11.5">Live Salesforce &amp; ops tables</text>
  <text class="bw-sans bw-mid" x="812" y="185" fill="#6B6560" font-size="11">Allowlisted schema tools</text>

  <rect class="bw-card" x="796" y="216" width="212" height="84" fill="#FAF9F6" stroke="#DDD8CE" stroke-width="1"/>
  <text class="bw-mono bw-bronze" x="812" y="241" fill="#8B7355" font-size="9.5" letter-spacing="1.4">4 DEPARTMENTS SERVED</text>
  <text class="bw-sans bw-ink" x="812" y="264" fill="#2D2A26" font-size="12.5" font-weight="600">Automated BI &amp; Workflows</text>
  <text class="bw-mono bw-mid" x="812" y="284" fill="#6B6560" font-size="9.8">Sales · Mktg · Support · Eng</text>

  <!-- Bottom Telemetry Bar -->
  <line class="bw-rule" x1="32" y1="342" x2="1008" y2="342" stroke="#DDD8CE" stroke-width="1"/>
  <g transform="translate(32, 356)">
    <text class="bw-serif bw-ink" x="0" y="16" fill="#2D2A26" font-size="22" font-weight="600">30 Days</text>
    <text class="bw-mono bw-mid" x="0" y="34" fill="#6B6560" font-size="9.5" letter-spacing="1">KICKOFF TO 24/7 PROD</text>

    <line x1="230" y1="2" x2="230" y2="36" stroke="#DDD8CE" stroke-width="1"/>
    <text class="bw-serif bw-ink" x="250" y="16" fill="#2D2A26" font-size="22" font-weight="600">3+ Months</text>
    <text class="bw-mono bw-mid" x="250" y="34" fill="#6B6560" font-size="9.5" letter-spacing="1">ZERO-DOWNTIME UPTIME</text>

    <line x1="490" y1="2" x2="490" y2="36" stroke="#DDD8CE" stroke-width="1"/>
    <text class="bw-serif bw-ink" x="510" y="16" fill="#2D2A26" font-size="22" font-weight="600">50%+ Cut</text>
    <text class="bw-mono bw-mid" x="510" y="34" fill="#6B6560" font-size="9.5" letter-spacing="1">LLM TOKEN &amp; API SPEND</text>

    <line x1="740" y1="2" x2="740" y2="36" stroke="#DDD8CE" stroke-width="1"/>
    <text class="bw-serif bw-ink" x="760" y="16" fill="#2D2A26" font-size="22" font-weight="600">Zero Leaks</text>
    <text class="bw-mono bw-mid" x="760" y="34" fill="#6B6560" font-size="9.5" letter-spacing="1">PII MASKED · VAULTED KEYS</text>
  </g>
</svg>
