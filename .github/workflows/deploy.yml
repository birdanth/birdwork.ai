name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index.html from src/data/site.yaml
        run: |
          node scripts/build.mjs --check
          node scripts/build.mjs
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 5fb1be728b47c260542d53c6cb07d7aa
          command: pages deploy . --project-name=birdwork
